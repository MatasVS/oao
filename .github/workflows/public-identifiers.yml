name: Public identifiers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    # Private downstream distributions legitimately contain their identifiers.
    # Release PRs from this repository only bump versions, and main is scanned
    # again once they merge; a fork's branch with the same name is still
    # scanned.
    if: >-
      ${{
        !github.event.repository.private &&
        !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject private deployment identifiers
        run: node scripts/check-public-identifiers.mjs
